; ============================================================
; EVA-SHELL — polybar config.ini
; Top Bar — NERV HUD header matching reference
; ============================================================

include-file = ~/.config/eva-shell/config/polybar/colors.ini

; ============================================================
; TOP BAR
; ============================================================
[bar/eva-top]
width  = 100%
height = 24
offset-x = 0
offset-y = 0

background = ${colors.bg}
foreground = ${colors.fg}

border-bottom-size  = 1
border-bottom-color = ${colors.border-act}

font-0 = JetBrains Mono:pixelsize=9:antialias=true;2
font-1 = JetBrains Mono:pixelsize=9:style=Bold:antialias=true;2
font-2 = Symbols Nerd Font:pixelsize=10;2

modules-left   = nerv-header
modules-center = danang
modules-right  = nerv-clock

separator = 
separator-foreground = ${colors.border}

wm-restack = i3
override-redirect = true
enable-ipc = true

; ============================================================
; LEFT — NERV identification
; ============================================================
[module/nerv-header]
type = custom/text
content = "NERV-HQ // GEO-FRONT // MAGI-01-ORIGINAL // SECTION-1"
content-foreground = ${colors.fg-label}
content-font = 1
content-padding = 1

; ============================================================
; CENTER — DANANG defense screen label
; ============================================================
[module/danang]
type = custom/text
content = "◈ DANANG TYPE-B DEFENSE SCREEN ◈"
content-foreground = ${colors.border-act}
content-font = 2
content-padding = 1

; ============================================================
; RIGHT — NERV CLOCK with clearance
; ============================================================
[module/nerv-clock]
type     = internal/date
interval = 1

date     = %Y.%m.%d
time     = %H:%M:%S

format         = <label>
label          = %date% // %time% // CLEARANCE-AAA
label-foreground = ${colors.fg-dim}
label-font       = 1
label-padding    = 1
