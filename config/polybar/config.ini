; ============================================================
; EVA-SHELL — polybar config.ini
; Phase 9: Top Bar
; ============================================================

include-file = ~/.config/eva-shell/config/polybar/colors.ini

; ============================================================
; TOP BAR
; ============================================================
[bar/eva-top]
width  = 100%
height = 24
offset-x = 0
offset-y = 0

background = ${colors.bg}
foreground = ${colors.fg}

border-bottom-size  = 1
border-bottom-color = ${colors.border-act}

font-0 = JetBrains Mono:pixelsize=9:antialias=true;2
font-1 = JetBrains Mono:pixelsize=9:style=Bold:antialias=true;2
font-2 = Symbols Nerd Font:pixelsize=10;2

modules-left   = workspaces
modules-center = nerv-clock
modules-right  = cpu ram temp network battery

separator = 
separator-foreground = ${colors.border}

wm-restack = i3
override-redirect = true
enable-ipc = true

; ============================================================
; WORKSPACE MODULE
; ============================================================
[module/workspaces]
type = internal/i3

format          = <label-state>
label-focused   = %index%
label-focused-foreground  = ${colors.green}
label-focused-background  = ${colors.bg-panel}
label-focused-padding     = 2
label-focused-font        = 2

label-unfocused = %index%
label-unfocused-foreground = ${colors.fg-dim}
label-unfocused-padding    = 2

label-urgent   = %index%
label-urgent-foreground   = ${colors.crit}
label-urgent-padding      = 2

; ============================================================
; NERV CLOCK — center
; ============================================================
[module/nerv-clock]
type     = internal/date
interval = 1

date     = %Y.%m.%d
time     = %H:%M:%S

format         = <label>
label          = [ %date% // %time% ]
label-foreground = ${colors.green}
label-font       = 2

; ============================================================
; CPU
; ============================================================
[module/cpu]
type     = internal/cpu
interval = 2

format         = <label>
label          = CPU:%percentage%%
label-foreground = ${colors.cyan}
label-padding  = 1

format-warn         = <label>
label-warn          = CPU:%percentage%%
label-warn-foreground = ${colors.warn}

warn-percentage = 80

; ============================================================
; RAM
; ============================================================
[module/ram]
type     = internal/memory
interval = 2

format         = <label>
label          = RAM:%percentage_used%%
label-foreground = ${colors.balthasar}
label-padding  = 1

; ============================================================
; TEMPERATURE
; ============================================================
[module/temp]
type          = internal/temperature
interval      = 5
thermal-zone  = 0
warn-temperature = 70

format         = <label>
label          = TMP:%temperature-c%
label-foreground = ${colors.caspar}
label-padding  = 1

format-warn         = <label>
label-warn          = TMP:%temperature-c%
label-warn-foreground = ${colors.crit}

; ============================================================
; NETWORK
; ============================================================
[module/network]
type          = internal/network
interface-type = wireless
interval      = 3

format-connected    = <label-connected>
label-connected     = NET:%signal%%
label-connected-foreground = ${colors.green}
label-connected-padding    = 1

format-disconnected    = <label-disconnected>
label-disconnected     = NET:--
label-disconnected-foreground = ${colors.fg-dim}
label-disconnected-padding    = 1

; ============================================================
; BATTERY
; ============================================================
[module/battery]
type          = internal/battery
full-at       = 99
low-at        = 20
battery       = BAT0
adapter       = AC

format-charging    = <label-charging>
label-charging     = BAT:%percentage%%↑
label-charging-foreground = ${colors.green}
label-charging-padding    = 1

format-discharging    = <label-discharging>
label-discharging     = BAT:%percentage%%
label-discharging-foreground = ${colors.caspar}
label-discharging-padding    = 1

format-low    = <label-low>
label-low     = BAT:%percentage%%!
label-low-foreground = ${colors.crit}
label-low-padding    = 1

format-full    = <label-full>
label-full     = BAT:FULL
label-full-foreground = ${colors.green}
label-full-padding    = 1
