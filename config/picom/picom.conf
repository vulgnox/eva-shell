# ============================================================
# EVA-SHELL — picom.conf
# Compositor config — tuned for Intel Iris Plus (integrated GPU)
# Conservative: no heavy blur, no shadows on panels
# ============================================================

# ============================================================
# BACKEND — xrender is safer on Intel iGPU
# Use glx only if you confirm no tearing issues
# ============================================================
backend = "xrender";

# ============================================================
# OPACITY
# ============================================================
# HUD panels are slightly transparent — gives depth without weight
inactive-opacity = 0.85;
active-opacity   = 0.95;
frame-opacity    = 1.0;

# eww HUD panels — fully opaque
# Kitty center terminal — slightly transparent for depth
opacity-rule = [
  "100:class_g = 'eva-left-panel'",
  "100:class_g = 'eva-magi-center'",
  "100:class_g = 'eva-right-panel'",
  "100:class_g = 'eva-bottom-panel'",
  "95:class_g  = 'eva-center'",
  "90:class_g  = 'kitty'"
];

# ============================================================
# SHADOWS — disabled on Intel iGPU (performance)
# ============================================================
shadow          = false;
shadow-radius   = 0;
shadow-opacity  = 0;

# ============================================================
# FADING — subtle, fast
# ============================================================
fading          = true;
fade-in-step    = 0.08;
fade-out-step   = 0.08;
fade-delta      = 4;

# No fading for HUD panels
no-fading-openclose = false;
fade-exclude = [
  "class_g = 'eva-left-panel'",
  "class_g = 'eva-magi-center'",
  "class_g = 'eva-right-panel'",
  "class_g = 'eva-bottom-panel'"
];

# ============================================================
# BLUR — DISABLED (Intel iGPU, 8GB RAM — not worth it)
# Enable later only if performance is confirmed fine
# ============================================================
blur-method = "none";

# ============================================================
# VSYNC — reduces tearing on Intel
# ============================================================
vsync = true;

# ============================================================
# MISC
# ============================================================
mark-wmwin-focused    = true;
mark-ovredir-focused  = false;
use-ewmh-active-win   = true;
detect-rounded-corners = false;
detect-client-opacity  = true;
detect-transient       = true;
glx-no-stencil         = true;
use-damage             = true;

# ============================================================
# WINDOW TYPE RULES
# ============================================================
wintypes:
{
  tooltip      = { fade = true; shadow = false; opacity = 0.9; focus = true; };
  dock         = { shadow = false; clip-shadow-above = true; };
  dnd          = { shadow = false; };
  popup_menu   = { opacity = 0.95; };
  dropdown_menu = { opacity = 0.95; };
};
